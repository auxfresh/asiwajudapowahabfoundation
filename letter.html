<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsor Letter</title>

<style>
    body {
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
    }

    .letter-frame {
        max-width: 800px;
        margin: 60px auto;
        padding: 20px;
        background: #ffffff;
        border: 12px solid #1a1a1a; /* Frame border */
        border-radius: 10px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        text-align: center;
    }

    .letter-frame img {
        width: 100%;
        height: auto;
        border-radius: 5px;
    }

    .title {
        text-align: center;
        margin-top: 30px;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    /* Title Card */
.foundation-title {
    background: #ffffff;
    padding: 20px 30px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 900px;
    margin: 40px auto;
}

/* Gradient Text */
.foundation-title h1 {
    margin: 0;
    font-size: 28px;
    font-weight: bold;
    line-height: 1.2;
    letter-spacing: 3px;
    font-family: Georgia, serif;

    background: linear-gradient(
        90deg,
        #ff5f6d,
        #ff9966,
        #b68c2a,
        #6a8f00
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
</style>
</head>
